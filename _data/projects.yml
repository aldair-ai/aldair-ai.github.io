- id: abaudit
  title: abaudit
  featured: true
  description: "Open-source Python library that tells you whether to trust an A/B test result: detects sample ratio mismatch, optional stopping, metric fishing and data fabrication."
  details: |
    Open source Python library that audits the statistical validity of A/B test results.
    Most experimentation tools tell you *whether* a result is significant.
    **abaudit** tells you *whether to trust it*.

    Built on the Ioannidis (2005) Positive Predictive Value framework, the library
    detects Sample Ratio Mismatch, optional stopping inflation, multiple metric fishing,
    and data fabrication, then computes a composite bias score and generates a
    self-contained HTML audit report.

    - Pip-installable · CI/CD via GitHub Actions · Published on PyPI
    - 184 tests · 99% coverage · tested on Python 3.9 – 3.12
    - Modules: `validity`, `design`, `runtime`, `report`
  image:
    src: /assets/img/abaudit.jpg
    width: 2830
    height: 735
    alt: abaudit library
  metrics: ["On PyPI", "184 tests", "99% coverage"]
  tags: [Python, GitHub Actions]
  links:
    - label: GitHub
      icon: github
      url: https://github.com/aldair-ai/abaudit
    - label: PyPI
      icon: external
      url: https://pypi.org/project/abaudit/

